name: Integration

# The runtime packages on every desktop platform and in every browser. Mobile
# is not here: the packages are pure Dart, and the widget tests run on the VM.
on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on the default branch.
    branches: [master, 'ci/**']
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
      - name: riverpod
        working-directory: packages/riverpod
        run: dart test -r expanded
      - name: flutter_riverpod
        if: ${{ !cancelled() }}
        working-directory: packages/flutter_riverpod
        run: flutter test --no-pub
      - name: hooks_riverpod
        if: ${{ !cancelled() }}
        working-directory: packages/hooks_riverpod
        run: flutter test --no-pub

  desktop-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps: *desktop_steps

  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    steps: *desktop_steps

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *desktop_steps

  desktop-windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps: *desktop_steps

  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: chrome
      COMPILER: dart2js
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/dart-test-browser@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        with:
          platform: ${{ env.PLATFORM }}
          compiler: ${{ env.COMPILER }}
          working-directory: packages/riverpod

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: chrome
      COMPILER: dart2wasm
    steps: *web_steps

  web-linux-firefox-dart2js:
    name: Web Linux x64 Firefox dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: firefox
      COMPILER: dart2js
    steps: *web_steps

  web-macos-safari-dart2js:
    name: Web macOS ARM64 Safari dart2js
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PLATFORM: safari
      COMPILER: dart2js
    steps: *web_steps

  # flutter test runs in Chrome only. Without --wasm it compiles with DDC,
  # not dart2js.
  web-linux-chrome-flutter-ddc:
    name: Web Linux x64 Chrome Flutter ddc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPILER: ddc
    steps: &web_flutter_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
      - name: flutter_riverpod
        working-directory: packages/flutter_riverpod
        env:
          COMPILER: ${{ env.COMPILER }}
        run: |
          args=(--no-pub --platform chrome)
          [[ "$COMPILER" == dart2wasm ]] && args+=(--wasm)
          flutter test "${args[@]}"
      - name: hooks_riverpod
        if: ${{ !cancelled() }}
        working-directory: packages/hooks_riverpod
        env:
          COMPILER: ${{ env.COMPILER }}
        run: |
          args=(--no-pub --platform chrome)
          [[ "$COMPILER" == dart2wasm ]] && args+=(--wasm)
          flutter test "${args[@]}"
      # The DevTools extension: browser only (dart:js_interop). Not with
      # dart2wasm: the extension ships as a dart2js build (devtools_extensions
      # build_and_copy), and dart2wasm in Dart 3.13.1 hangs while loading
      # test/src/vm_service/eval_test.dart (a miscompile triggered by
      # devtools_app_shared's EvalOnDartLibrary constructor).
      - name: riverpod_devtool
        if: ${{ !cancelled() && env.COMPILER == 'ddc' }}
        working-directory: packages/riverpod_devtool
        run: flutter test --no-pub --platform chrome

  web-linux-chrome-flutter-dart2wasm:
    name: Web Linux x64 Chrome Flutter dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPILER: dart2wasm
    steps: *web_flutter_steps
